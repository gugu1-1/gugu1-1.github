<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隔空雾镜</title>
  
  <!-- 引入 MediaPipe 核心识别模型 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      touch-action: none; 
    }

    /* 渲染主画布 */
    #main-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* 启动遮罩层 */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.5s;
    }

    #start-btn {
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0984e3, #74b9ff);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(9, 132, 227, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start-btn:active {
      transform: scale(0.95);
    }

    /* 顶部状态提示条 */
    #status-text {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 15;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* 底部控制栏（滑块） */
    #control-bar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 15px 25px;
      border-radius: 30px;
      z-index: 15;
      display: none;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #control-bar label {
      color: #fff;
      font-size: 15px;
      white-space: nowrap;
    }

    /* 美化滑块 */
    input[type=range] {
      -webkit-appearance: none;
      width: 150px;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
    }

    #video-stream {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 提示状态条 -->
  <div id="status-text">初始化中...</div>

  <!-- 启动界面 -->
  <div id="ui-layer">
    <button id="start-btn">点击开启隔空雾镜</button>
  </div>

  <!-- 底部滑块控制栏 -->
  <div id="control-bar">
    <label>擦拭范围: <span id="brush-size-val">25</span></label>
    <input type="range" id="brush-slider" min="5" max="120" value="25">
  </div>

  <!-- 渲染画布 -->
  <canvas id="main-canvas"></canvas>
  <video id="video-stream" playsinline autoplay muted></video>

  <script>
    const btnStart = document.getElementById('start-btn');
    const uiLayer = document.getElementById('ui-layer');
    const statusText = document.getElementById('status-text');
    const controlBar = document.getElementById('control-bar');
    const brushSlider = document.getElementById('brush-slider');
    const brushSizeVal = document.getElementById('brush-size-val');
    
    const video = document.getElementById('video-stream');
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    
    // 擦拭笔刷大小
    let FINGER_SIZE = parseInt(brushSlider.value);

    // 监听滑块变化
    brushSlider.addEventListener('input', (e) => {
      FINGER_SIZE = parseInt(e.target.value);
      brushSizeVal.textContent = FINGER_SIZE;
    });

    // 蒙版图层：黑色代表有雾，透明(被抠掉)代表露出底层清晰画面
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');
    
    // 模糊图层：用于生成毛玻璃效果
    const blurCanvas = document.createElement('canvas');
    const blurCtx = blurCanvas.getContext('2d');

    // 处理屏幕尺寸变化
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      blurCanvas.width = width;
      blurCanvas.height = height;

      // 备份蒙版以防重置
      const backup = document.createElement('canvas');
      backup.width = maskCanvas.width;
      backup.height = maskCanvas.height;
      if (maskCanvas.width > 0) {
        backup.getContext('2d').drawImage(maskCanvas, 0, 0);
      }

      maskCanvas.width = width;
      maskCanvas.height = height;
      
      // 默认铺满浓雾（黑色）
      maskCtx.fillStyle = '#000000';
      maskCtx.fillRect(0, 0, width, height);

      if (backup.width > 0) {
        maskCtx.drawImage(backup, 0, 0, width, height);
      }
    }
    window.addEventListener('resize', resize);
    resize();

    // 启动摄像头
    btnStart.addEventListener('click', async () => {
      try {
        btnStart.textContent = "请求摄像头权限...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          uiLayer.style.opacity = '0';
          setTimeout(() => uiLayer.style.display = 'none', 500);
          
          statusText.style.display = 'block';
          controlBar.style.display = 'flex';
          statusText.textContent = "正在加载人工智能模型 (需稍等几秒)...";
          
          startRenderLoop();
          initAITracking();
        };
      } catch (err) {
        alert("摄像头加载失败！请在浏览器设置中允许摄像头权限。");
        btnStart.textContent = "点击开启隔空雾镜";
      }
    });

    // --- 核心优化：平滑追踪滤波算法 (Moving Average Filter) ---
    // 为了解决手势追踪识别掉帧、断断续续的问题，引入平滑插值
    let rawX = null, rawY = null;           // 改为二维映射
    let targetX = null, targetY = null;     
    let currentX = null, currentY = null;   
    let velX = 0, velY = 0;                 // 物理速度向量
    let lastDrawX = null, lastDrawY = null; 
    let isHandPresent = false;              
    let isPenDown = false;                  // 捏合双指为落笔，松开为抬笔
    let handLostTimer = null;               // 防闪烁定时器

    // --- 雾气擦拭核心逻辑 ---
    function interpolateWipe(x1, y1, x2, y2) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      // 究极高密度插值，每 1.5 像素插值一次，配合物理防抖彻底消灭锯齿
      const steps = Math.max(1, Math.ceil(dist / 1.5)); 
      
      maskCtx.save();
      // 使用 destination-out，彻底挖空雾气蒙版，实现 100% 全透明
      maskCtx.globalCompositeOperation = 'destination-out';
      
      for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        
        // 更高级的柔和径向渐变，让擦除边缘像真实水汽一样自然羽化，告别生硬锯齿
        const grad = maskCtx.createRadialGradient(px, py, FINGER_SIZE * 0.25, px, py, FINGER_SIZE);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(0.75, 'rgba(0,0,0,0.9)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        maskCtx.fillStyle = grad;
        maskCtx.beginPath();
        maskCtx.arc(px, py, FINGER_SIZE, 0, Math.PI * 2);
        maskCtx.fill();
      }
      maskCtx.restore();
    }

    // 支持屏幕直接触摸擦拭作为备用
    function onPointerDown(e) { 
      lastDrawX = null; currentX = e.clientX; currentY = e.clientY; 
      interpolateWipe(currentX, currentY, currentX, currentY); 
      e.preventDefault(); 
    }
    function onPointerMove(e) { 
      if (e.buttons > 0) {
        if (lastDrawX === null) { lastDrawX = e.clientX; lastDrawY = e.clientY; }
        interpolateWipe(lastDrawX, lastDrawY, e.clientX, e.clientY);
        lastDrawX = e.clientX; lastDrawY = e.clientY;
      }
      e.preventDefault(); 
    }
    function onPointerUp() { lastDrawX = null; }
    
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);

    // --- 增加雾气 (张嘴时调用) ---
    function addFog() {
      maskCtx.save();
      maskCtx.globalCompositeOperation = 'source-over';
      maskCtx.fillStyle = 'rgba(0, 0, 0, 0.08)'; // 每次叠加极浅的黑层
      maskCtx.fillRect(0, 0, width, height);
      maskCtx.restore();
    }

    function initAITracking() {
      let faceReady = false;
      let handReady = false;

      function checkAllReady() {
        if (faceReady && handReady && statusText.textContent.includes("加载")) {
          statusText.textContent = "张开嘴巴起雾，食指与大拇指捏合隔空擦拭";
        }
      }

      // 1. 张嘴检测引擎
      const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
      faceMesh.onResults((results) => {
        faceReady = true;
        checkAllReady();
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const lm = results.multiFaceLandmarks[0];
          const topLip = lm[13], bottomLip = lm[14], leftCorner = lm[78], rightCorner = lm[308];
          
          const verticalDist = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
          const horizontalDist = Math.hypot(leftCorner.x - rightCorner.x, leftCorner.y - rightCorner.y);
          
          // 若张嘴比例足够大
          if (verticalDist / (horizontalDist || 1) > 0.15) {
            statusText.textContent = "检测到张嘴：正在补充雾气";
            addFog();
          } else if (isHandPresent) {
            statusText.textContent = isPenDown ? "✏️ 正在擦拭..." : "✋ 双指已松开 (移动找位置)";
          } else {
            statusText.textContent = "张开嘴巴起雾，食指与大拇指捏合隔空擦拭";
          }
        }
      });

      // 2. 双指捏合追踪引擎 (Pinch Gesture)
      const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
      hands.onResults((results) => {
        handReady = true;
        checkAllReady();
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          clearTimeout(handLostTimer);
          isHandPresent = true;
          
          const landmarks = results.multiHandLandmarks[0];
          
          // 获取 大拇指指尖(4) 和 食指指尖(8)
          const thumbTip = landmarks[4];
          const indexTip = landmarks[8];
          
          // 核心：计算三维空间中大拇指与食指的距离
          const pinchDist = Math.hypot(
            thumbTip.x - indexTip.x,
            thumbTip.y - indexTip.y,
            thumbTip.z - indexTip.z
          );
          
          // 引入迟滞区间 (Hysteresis) 防闪烁：
          // 距离小于 0.045 视为捏紧(落笔)，大于 0.065 视为彻底松开(抬笔)
          if (!isPenDown && pinchDist < 0.045) isPenDown = true;
          if (isPenDown && pinchDist > 0.065) isPenDown = false;

          // 笔触的中心位置：取大拇指和食指捏合部位的中间点，手感最自然
          const midX = (thumbTip.x + indexTip.x) / 2;
          const midY = (thumbTip.y + indexTip.y) / 2;

          // 映射到屏幕坐标 (镜像翻转 X 轴)
          rawX = (1 - midX) * width;
          rawY = midY * height;
          
          if (targetX === null) {
            targetX = rawX; targetY = rawY;
            currentX = rawX; currentY = rawY;
            lastDrawX = rawX; lastDrawY = rawY;
          } else {
            // AI 坐标层的轻微预平滑
            targetX += (rawX - targetX) * 0.7;
            targetY += (rawY - targetY) * 0.7;
          }
        } else {
          // 防抖机制：未检测到手时
          if (isHandPresent) {
            handLostTimer = setTimeout(() => {
              isHandPresent = false;
              isPenDown = false; // 手离开镜头时强制断开线条
              targetX = null; targetY = null;
              currentX = null; currentY = null;
              lastDrawX = null; lastDrawY = null;
            }, 250);
          }
        }
      });

      // 启动统一的摄像头逐帧分发
      const camera = new Camera(video, {
        onFrame: async () => {
          await faceMesh.send({ image: video });
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });
      camera.start();
    }

    function startRenderLoop() {
      function render() {
        // --- 第一步：手势追踪无延迟处理 ---
        if (isHandPresent && currentX !== null && targetX !== null) {
          // 【军工级防抖黑科技：弹簧阻尼物理系统】
          // 彻底过滤 AI 坐标的微小闪烁与跳跃
          const STIFFNESS = 0.12; // 弹力刚度
          const DAMPING = 0.72;   // 阻尼摩擦

          velX += (targetX - currentX) * STIFFNESS;
          velY += (targetY - currentY) * STIFFNESS;

          velX *= DAMPING;
          velY *= DAMPING;

          currentX += velX;
          currentY += velY;

          // 如果处于双指捏合（落笔）状态，则执行物理防抖擦除
          if (isPenDown) {
            if (lastDrawX !== null && Math.hypot(currentX - lastDrawX, currentY - lastDrawY) > 0.05) {
              interpolateWipe(lastDrawX, lastDrawY, currentX, currentY);
              lastDrawX = currentX;
              lastDrawY = currentY;
            } else if (lastDrawX === null) {
              lastDrawX = currentX;
              lastDrawY = currentY;
            }
          } else {
            // 松开双指时立刻断开线条，随便找位置
            lastDrawX = null;
            lastDrawY = null;
          }
        }

        // --- 第二步：画面合成 ---
        // 1. 底层：完全通透的高清镜像画面
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, width, height);
        ctx.restore();

        // 2. 制作纯净的雾气图层
        blurCtx.clearRect(0, 0, width, height);
        blurCtx.save();
        blurCtx.translate(width, 0);
        blurCtx.scale(-1, 1);
        blurCtx.filter = 'blur(25px) brightness(1.1)';
        blurCtx.drawImage(video, 0, 0, width, height);
        blurCtx.filter = 'none';
        blurCtx.fillStyle = 'rgba(235, 245, 255, 0.65)';
        blurCtx.fillRect(0, 0, width, height);
        blurCtx.restore();

        // 3. 用 mask 蒙版剔除擦除区域
        blurCtx.save();
        blurCtx.globalCompositeOperation = 'destination-in';
        blurCtx.drawImage(maskCanvas, 0, 0); 
        blurCtx.restore();

        // 4. 将带镂空孔洞的雾气图层盖在视频上
        ctx.drawImage(blurCanvas, 0, 0);

        requestAnimationFrame(render);
      }
      render();
    }
  </script>
</body>
</html>
